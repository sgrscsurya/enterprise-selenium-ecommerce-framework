# ============================================================
# QA Environment Configuration
# Phase 8: Multi-Environment Support (dev/qa/uat/prod)
# ============================================================

# Base Application URL - QA
url=https://www.saucedemo.com
browser=chrome
headless=true

# Timeouts in Seconds
implicit.wait=10
explicit.wait=15
page.load.timeout=30

# Reporting and Screenshots
report.path=reports/ExtentReport-QA.html
screenshot.path=reports/screenshots/
override.reports=true

# Logging Configuration
log.level=INFO

# Environment Identifier (used in reports)
env.name=QA
env.version=1.0-SNAPSHOT
