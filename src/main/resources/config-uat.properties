# ============================================================
# UAT Environment Configuration
# Phase 8: Multi-Environment Support (dev/qa/uat/prod)
# ============================================================

# Base Application URL - UAT
url=https://www.saucedemo.com
browser=chrome
headless=true

# Timeouts in Seconds (slightly relaxed, UAT mirrors production data volume)
implicit.wait=10
explicit.wait=18
page.load.timeout=35

# Reporting and Screenshots
report.path=reports/ExtentReport-UAT.html
screenshot.path=reports/screenshots/
override.reports=true

# Logging Configuration
log.level=INFO

# Environment Identifier (used in reports)
env.name=UAT
env.version=1.0-SNAPSHOT
