# ============================================================
# Development Environment Configuration
# Phase 8: Multi-Environment Support (dev/qa/uat/prod)
# ============================================================

# Base Application URL - Dev
url=https://www.saucedemo.com
browser=chrome
headless=true

# Timeouts in Seconds (relaxed for an unstable dev environment)
implicit.wait=15
explicit.wait=20
page.load.timeout=45

# Reporting and Screenshots
report.path=reports/ExtentReport-Dev.html
screenshot.path=reports/screenshots/
override.reports=true

# Logging Configuration
log.level=DEBUG

# Environment Identifier (used in reports)
env.name=DEV
env.version=1.0-SNAPSHOT
