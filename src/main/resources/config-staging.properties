# ============================================================
# Staging Environment Configuration
# Phase 7: Multi-Environment Support
# ============================================================

# Base Application URL - Staging
url=https://www.saucedemo.com
browser=chrome
headless=true

# Timeouts in Seconds (relaxed for slower staging environments)
implicit.wait=15
explicit.wait=20
page.load.timeout=45

# Reporting and Screenshots
report.path=reports/ExtentReport-Staging.html
screenshot.path=reports/screenshots/
override.reports=true

# Logging Configuration
log.level=DEBUG

# Environment Identifier (used in reports)
env.name=STAGING
env.version=1.0-SNAPSHOT
