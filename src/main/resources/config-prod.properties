# ============================================================
# Production Environment Configuration
# Phase 7: Multi-Environment Support
# ============================================================

# Base Application URL - Production (same target for SauceDemo)
url=https://www.saucedemo.com
browser=chrome
headless=true

# Timeouts in Seconds (tighter SLA for production smoke tests)
implicit.wait=10
explicit.wait=15
page.load.timeout=30

# Reporting and Screenshots
report.path=reports/ExtentReport-Production.html
screenshot.path=reports/screenshots/
override.reports=true

# Logging Configuration
log.level=WARN

# Environment Identifier (used in reports)
env.name=PRODUCTION
env.version=1.0-SNAPSHOT
